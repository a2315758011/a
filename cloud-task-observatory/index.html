<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>工程任务观察站 · Cloud Task Observatory</title>
<style>
:root{color-scheme:dark;--bg:#090f18;--panel:#121e2d;--line:#26394d;--fg:#edf5ff;--muted:#99aec5;--gold:#dabc64;--blue:#6bb6ff;--red:#fa7f91;--amber:#f4bf78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{padding:25px 30px;border-bottom:1px solid var(--line);display:flex;gap:18px;justify-content:space-between;align-items:center}header h1{margin:0;font-size:24px}header p{color:var(--muted);margin:5px 0 0}main{padding:24px 30px;max-width:1500px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.stat strong{display:block;font-size:31px}.stat span,.hint{color:var(--muted)}.panel{margin-top:18px}.panel h2{margin:0 0 10px;font-size:18px}.graph{overflow:auto;min-height:290px;background-image:radial-gradient(#26374c 1px,transparent 1px);background-size:22px 22px;border-radius:9px}.graph svg{display:block;min-width:100%}.node{fill:#192a3c;stroke:#54708d;stroke-width:1.7}.node.done{stroke:var(--gold)}.node.active{stroke:var(--blue)}.node.failed{stroke:var(--red)}.node.waiting{stroke:var(--amber)}.edge{fill:none;stroke:#52657c;stroke-width:2.3}.edge.done{stroke:var(--gold)}.edge.active{stroke:var(--blue);stroke-dasharray:7 7;animation:flow .8s linear infinite}.edge.failed{stroke:var(--red);stroke-dasharray:5 5}@keyframes flow{to{stroke-dashoffset:-28}}.node-title{fill:#eff6ff;font-size:13px;font-weight:650;pointer-events:none}.node-sub{fill:#99b0cc;font-size:10px;pointer-events:none}.node-pct{fill:#dbbd65;font-size:11px;pointer-events:none}.details{display:grid;grid-template-columns:1fr 1fr;gap:18px}.progress{height:8px;background:#2b394b;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold)}.mono{font-family:Consolas,monospace}.warn{color:var(--red)}.good{color:#86d9bb}.waiting-text{color:var(--amber)}.small{font-size:12px}button,select{color:var(--fg);background:#20344c;border:1px solid #48627e;padding:9px 13px;border-radius:9px}button{cursor:pointer}button:focus-visible{outline:2px solid var(--blue)}.tag{display:inline-block;border-radius:5px;padding:2px 7px;background:#293b50;color:#dceaff}.grid-row{padding:10px 0;border-bottom:1px solid #2c4055}.grid-row:last-child{border:0}#taskinfo{white-space:pre-wrap;overflow-wrap:anywhere}.warning-banner{padding:10px 14px;background:#372d22;border:1px solid #7b6038;border-radius:8px;margin:12px 0}.error-banner{background:#3b2330;border-color:#7c4150}.legend{display:flex;gap:17px;flex-wrap:wrap;margin:12px 0}.legend b{font-weight:normal}#events{max-height:290px;overflow:auto}a{color:#9cceff}@media(max-width:820px){header{display:block}main{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:1fr}}
</style></head><body><header><div><h1>工程任务观察站 <span class="tag">CLOUD / V0</span></h1><p>任务树、精确断点、进度依据、AI 最后心跳与故障恢复位置</p></div><div><span id="sync" class="waiting-text">未载入数据</span> <button id="reload">刷新状态</button></div></header>
<main><section class="stats"><div class="stat"><span>已登记任务</span><strong id="total">—</strong></div><div class="stat"><span>已验收任务</span><strong id="done">—</strong></div><div class="stat"><span>验收覆盖率</span><strong id="pct">—</strong><div class="progress"><i id="bar" style="width:0"></i></div></div><div class="stat"><span>故障与受影响节点</span><strong id="broken">—</strong></div></section>
<div id="banner" role="status"></div><section class="panel"><h2>任务依赖链</h2><p class="hint">金色：验收通过；蓝色动态：运行中；红色：失败或被上游故障影响；黄色：待依赖。点击节点查看证据和恢复点。</p><div id="graph" class="graph"></div></section><div class="details"><section class="panel"><h2>选中任务</h2><div id="taskinfo" class="hint">点击任务节点</div></section><section class="panel"><h2>最近事件与故障定位</h2><div id="events"></div></section></div>
<p class="hint small">只读控制台。没有收到采集事件时不推断正在执行、也不将 AI 的文字声明算作验收。刷新间隔 15 秒；心跳超时将显示数据过期。</p></main>
<script>
'use strict';
const $=x=>document.getElementById(x), OK=new Set(['VERIFIED','COMPLETED']), BAD=new Set(['FAILED','BLOCKED','NEEDS_ATTENTION']);
let snapshot=null,selected=null;
function date(s){return s?new Date(s).toLocaleString('zh-CN',{hour12:false}):'无记录'}
function state(t,by,seen=new Set()){if(seen.has(t.id))return {bad:true,roots:['依赖环']};seen.add(t.id);let roots=[];for(const id of t.dependencies||[]){const x=by.get(id);if(!x){roots.push('缺失:'+id);continue}if(BAD.has(x.status))roots.push(x.id);const d=state(x,by,new Set(seen));roots.push(...d.roots)}return {bad:BAD.has(t.status)||roots.length>0,roots:[...new Set(roots)]}}
function classify(t,by){const s=state(t,by);return s.bad?'failed':OK.has(t.status)?'done':t.status==='IN_PROGRESS'?'active':(t.dependencies||[]).some(id=>!OK.has(by.get(id)?.status))?'waiting':''}
function text(svg,x,y,value,cls){const el=document.createElementNS('http://www.w3.org/2000/svg','text');el.setAttribute('x',x);el.setAttribute('y',y);el.setAttribute('class',cls);el.textContent=String(value);svg.appendChild(el)}
function draw(data){const arr=data.tasks||[],by=new Map(arr.map(t=>[t.id,t]));const level=new Map(),visiting=new Set();function depth(id){if(level.has(id))return level.get(id);if(visiting.has(id))return 0;visiting.add(id);let n=0;for(const dep of by.get(id)?.dependencies||[])if(by.has(dep))n=Math.max(n,depth(dep)+1);visiting.delete(id);level.set(id,Math.min(n,12));return level.get(id)}arr.forEach(t=>depth(t.id));const counts=new Map(),pos=new Map();arr.forEach(t=>{const d=level.get(t.id)||0,row=counts.get(d)||0;counts.set(d,row+1);pos.set(t.id,{x:36+d*288,y:35+row*145})});const w=Math.max(800,...[...pos.values()].map(p=>p.x+275)),h=Math.max(280,...[...pos.values()].map(p=>p.y+125));const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('width',w);svg.setAttribute('height',h);svg.setAttribute('role','img');svg.setAttribute('aria-label','任务依赖关系图');for(const t of arr){const b=pos.get(t.id);for(const dep of t.dependencies||[]){const a=pos.get(dep);if(!a)continue;const edge=document.createElementNS('http://www.w3.org/2000/svg','path');const m=(a.x+b.x+260)/2;edge.setAttribute('d',`M ${a.x+255} ${a.y+47} C ${m} ${a.y+47}, ${m} ${b.y+47}, ${b.x} ${b.y+47}`);edge.setAttribute('class','edge '+(classify(t,by)==='failed'||classify(by.get(dep),by)==='failed'?'failed':OK.has(by.get(dep)?.status)?'done':t.status==='IN_PROGRESS'?'active':''));svg.appendChild(edge)}}for(const t of arr){const p=pos.get(t.id),g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',t.title+' '+t.status);const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',p.x);rect.setAttribute('y',p.y);rect.setAttribute('width',255);rect.setAttribute('height',104);rect.setAttribute('rx',10);rect.setAttribute('class','node '+classify(t,by));g.appendChild(rect);text(g,p.x+12,p.y+24,t.id,'node-sub');text(g,p.x+12,p.y+49,(t.title||t.id).slice(0,17),'node-title');text(g,p.x+12,p.y+73,t.status,'node-sub');text(g,p.x+12,p.y+91,`进度 ${progress(t,by)}%`,'node-pct');g.addEventListener('click',()=>details(t,by));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();details(t,by)}});svg.appendChild(g)}$('graph').replaceChildren(svg);if(selected&&by.has(selected))details(by.get(selected),by)}
function progress(t,by){const visited=new Set();function walk(id){if(visited.has(id))return;visited.add(id);for(const dep of by.get(id)?.dependencies||[])if(by.has(dep))walk(dep)}walk(t.id);return Math.round([...visited].filter(id=>OK.has(by.get(id)?.status)).length/Math.max(visited.size,1)*100)}
function details(t,by){selected=t.id;const s=state(t,by),x=$('taskinfo');x.replaceChildren();const rows=[['任务',t.title],['ID',t.id],['状态',t.status],['负责人',t.owner||'未登记'],['分支完成率',progress(t,by)+'%'],['故障根因',s.roots.join(' / ')||'暂无'],['最后更新',date(t.updatedAt)],['最后成功步骤',t.lastSuccess||'未登记'],['下一步恢复位置',t.resumePoint||'未登记'],['验收依据',t.evidence?.join('、')||'尚无'],['明确阻塞原因',t.blocker||'无']];for(const [name,value] of rows){const line=document.createElement('div');line.className='grid-row';const b=document.createElement('b');b.textContent=name+': ';const span=document.createElement('span');span.textContent=String(value??'');line.append(b,span);x.appendChild(line)}}
function render(d){snapshot=d;const tasks=d.tasks||[],by=new Map(tasks.map(t=>[t.id,t])),done=tasks.filter(t=>OK.has(t.status)).length,broken=tasks.filter(t=>state(t,by).bad).length;$('total').textContent=tasks.length;$('done').textContent=done;$('pct').textContent=tasks.length?Math.round(done/tasks.length*100)+'%':'—';$('bar').style.width=(tasks.length?100*done/tasks.length:0)+'%';$('broken').textContent=broken;const age=Date.now()-Date.parse(d.updatedAt||0),stale=!Number.isFinite(age)||age>90000;$('sync').textContent=stale?'采集数据过期 / 本地可能失联':'最近心跳 '+date(d.updatedAt);$('sync').className=stale?'warn':'good';$('banner').textContent=stale?'上游采集超过 90 秒未更新；以下显示最后已知状态，不代表当前仍在运行。':'';$('banner').className=stale?'warning-banner error-banner':'';draw(d);const el=$('events');el.replaceChildren();for(const evt of (d.events||[]).slice(-15).reverse()){const row=document.createElement('div');row.className='grid-row';row.textContent=`[${date(evt.at)}] ${evt.taskId||''} ${evt.type||''} ${evt.message||''}`;el.appendChild(row)}}
async function load(){try{const res=await fetch('./snapshot.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const d=await res.json();if(d.schemaVersion!==1||!Array.isArray(d.tasks))throw Error('数据格式异常');render(d)}catch(e){$('sync').textContent='数据读取失败';$('sync').className='warn';$('banner').textContent='云端快照不可用：'+e.message;$('banner').className='warning-banner error-banner'}}
$('reload').addEventListener('click',load);load();setInterval(load,15000);
</script></body></html>
