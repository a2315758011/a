name = "zh-task-observatory"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

# 首次部署：wrangler d1 create zh-task-observatory
# 将返回的数据库 ID 填到下面，再执行迁移。
[[d1_databases]]
binding = "DB"
database_name = "zh-task-observatory"
database_id = "请替换为实际数据库ID"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]