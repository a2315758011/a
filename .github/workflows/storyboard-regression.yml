name: Storyboard Regression

on:
  pull_request:
    paths:
      - "skills/storyboard-director-cn/**"
      - "分镜导演V4/**"
      - "分镜规则清单.json"
      - "剧本转分镜指令"
      - "剧本转分镜自检指令"
      - "剧本转分镜自动调用指令"
      - "学员分镜双规则完整版-V4.0.md"
      - "分镜SCG校验器-V1.js"
      - "分镜SCG回归样例-V1.json"
      - ".github/workflows/storyboard-regression.yml"
  push:
    branches:
      - "feature/storyboard-director-v4-20261026"
    paths:
      - "skills/storyboard-director-cn/**"
      - "分镜导演V4/**"
      - "分镜规则清单.json"
      - "剧本转分镜指令"
      - "剧本转分镜自检指令"
      - "剧本转分镜自动调用指令"
      - "学员分镜双规则完整版-V4.0.md"
      - "分镜SCG校验器-V1.js"
      - "分镜SCG回归样例-V1.json"
      - ".github/workflows/storyboard-regression.yml"

permissions:
  contents: read

jobs:
  storyboard-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run SCG regression cases
        run: node skills/storyboard-director-cn/scripts/分镜SCG校验器-V1.js skills/storyboard-director-cn/tests/分镜SCG回归样例-V1.json
      - name: Run V4 event-time regression cases
        run: node skills/storyboard-director-cn/scripts/分镜事件时长校验器-V4.js skills/storyboard-director-cn/tests/分镜时间回归样例-V4.json
