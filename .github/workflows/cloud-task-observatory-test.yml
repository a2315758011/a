name: 云端任务监控自动测试
on:
  push:
    branches: [feature/cloud-task-observatory-v0]
    paths:
      - 'cloud-task-observatory/**'
      - '.github/workflows/cloud-task-observatory-test.yml'
  pull_request:
    paths:
      - 'cloud-task-observatory/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 下载仓库
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验云端与采集器语法
        run: |
          node --check cloud-task-observatory/cloudflare/worker.mjs
          node --check cloud-task-observatory/collector/collector.cjs
      - name: 运行安全与断线恢复测试
        run: node --test cloud-task-observatory/tests/*.test.cjs
